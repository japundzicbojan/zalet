services:
  - type: web
    name: zalet
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    disk:
      name: zalet-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ZALET_DATA_DIR
        value: /var/data
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false
      - key: ZALET_RUN_SECRET
        sync: false
